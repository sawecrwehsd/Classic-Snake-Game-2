<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      gap: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #4ade80;
    }

    #hud {
      display: flex;
      gap: 60px;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #666;
    }

    #hud span { color: #fff; font-size: 1.1rem; font-weight: 600; }

    canvas {
      border: 1px solid #1f1f1f;
      border-radius: 4px;
      background: #111;
      box-shadow: 0 0 60px rgba(74, 222, 128, 0.05);
    }

    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #overlay h2 {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: #fff;
    }

    #overlay p { color: #555; font-size: 0.8rem; letter-spacing: 2px; }

    button {
      margin-top: 8px;
      padding: 12px 40px;
      background: #4ade80;
      color: #000;
      border: none;
      border-radius: 2px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    #controls {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: #333;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h1>Snake</h1>

  <div id="hud">
    <div>Score &nbsp;<span id="score">0</span></div>
    <div>Best &nbsp;<span id="best">0</span></div>
    <div>Level &nbsp;<span id="level">1</span></div>
  </div>

  <div style="position:relative;">
    <canvas id="c" width="480" height="480"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Ready?</h2>
      <p id="overlay-sub">Use arrow keys or WASD</p>
      <button id="btn">Start</button>
    </div>
  </div>

  <div id="controls">Arrow Keys / WASD to move &nbsp;·&nbsp; P to pause</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const btn = document.getElementById('btn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;

  let snake, dir, nextDir, food, score, best, level, speed, loop, running, paused;

  best = parseInt(localStorage.getItem('snakeBest') || '0');
  bestEl.textContent = best;

  function init() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    speed = 130;
    running = true;
    paused = false;
    scoreEl.textContent = 0;
    levelEl.textContent = 1;
    placeFood();
    overlay.style.display = 'none';
    clearInterval(loop);
    loop = setInterval(tick, speed);
  }

  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function tick() {
    if (!running || paused) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) return die();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;

      // Level up every 5 food
      if (score % 5 === 0) {
        level++;
        levelEl.textContent = level;
        speed = Math.max(50, speed - 10);
        clearInterval(loop);
        loop = setInterval(tick, speed);
      }

      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snakeBest', best);
      }

      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid dots
    ctx.fillStyle = '#161616';
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
      }
    }

    // Food
    const pulse = 0.85 + Math.sin(Date.now() / 200) * 0.15;
    ctx.fillStyle = `rgba(248, 113, 113, ${pulse})`;
    const fp = 3;
    ctx.beginPath();
    ctx.roundRect(food.x * CELL + fp, food.y * CELL + fp, CELL - fp * 2, CELL - fp * 2, 4);
    ctx.fill();

    // Snake
    snake.forEach((seg, i) => {
      const ratio = 1 - i / snake.length;
      const green = Math.round(180 + ratio * 75);
      ctx.fillStyle = i === 0 ? '#4ade80' : `rgb(0, ${green}, 70)`;
      const p = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + p, seg.y * CELL + p, CELL - p * 2, CELL - p * 2, i === 0 ? 6 : 3);
      ctx.fill();
    });

    // Eyes on head
    const h = snake[0];
    ctx.fillStyle = '#000';
    const ex = dir.y === 0 ? (dir.x > 0 ? 13 : 4) : 6;
    const ey = dir.x === 0 ? (dir.y > 0 ? 13 : 4) : 6;
    ctx.beginPath();
    ctx.arc(h.x * CELL + ex, h.y * CELL + ey, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(h.x * CELL + (dir.y === 0 ? ex : CELL - ex), h.y * CELL + (dir.x === 0 ? ey : CELL - ey), 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function die() {
    running = false;
    clearInterval(loop);
    overlayTitle.textContent = 'Game Over';
    overlaySub.textContent = `Score: ${score}`;
    btn.textContent = 'Play Again';
    overlay.style.display = 'flex';
  }

  document.addEventListener('keydown', e => {
    const map = {
      ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
    };

    if (map[e.key]) {
      const nd = map[e.key];
      // Prevent reversing
      if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
      e.preventDefault();
    }

    if (e.key === 'p' || e.key === 'P') {
      if (!running) return;
      paused = !paused;
      if (paused) {
        overlayTitle.textContent = 'Paused';
        overlaySub.textContent = 'Press P to resume';
        btn.style.display = 'none';
        overlay.style.display = 'flex';
      } else {
        overlay.style.display = 'none';
        btn.style.display = '';
      }
    }
  });

  btn.addEventListener('click', init);

  // Auto start
  init();
</script>
</body>
</html>
